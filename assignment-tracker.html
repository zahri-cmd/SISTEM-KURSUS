<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Assignment Tracker</title>
  <style>
    /* ── CSS Custom Properties ── */
    :root {
      --color-bg:        #f4f6f9;
      --color-surface:   #ffffff;
      --color-accent:    #1a3c6e;
      --color-accent-lt: #e8eef7;
      --color-text:      #1f2328;
      --color-muted:     #57606a;
      --color-border:    #e5e7eb;
      --color-green:     #16a34a;
      --color-green-lt:  #dcfce7;
      --color-red:       #dc2626;
      --color-red-lt:    #fee2e2;
      --radius:          10px;
      --shadow:          0 1px 4px rgba(0,0,0,0.08), 0 2px 10px rgba(0,0,0,0.05);
      --font:            -apple-system, "Segoe UI", system-ui, sans-serif;
      --space-sm:        0.5rem;
      --space-md:        1rem;
      --space-lg:        1.5rem;
      --space-xl:        2rem;
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--color-accent);
      color: #fff;
      padding: var(--space-lg) var(--space-xl);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header .subtitle {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-top: 2px;
    }

    /* ── Main Layout ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg);
    }

    /* ── Section Labels ── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      margin-bottom: var(--space-md);
    }

    /* ── Cards Row ── */
    .cards-row {
      display: flex;
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
    }

    .card {
      flex: 1;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .card-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--color-muted);
    }

    .card-value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .card-sub {
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    /* Card accent strips */
    .card-total         { border-left: 4px solid var(--color-accent); }
    .card-total .card-value { color: var(--color-accent); }

    .card-submitted     { border-left: 4px solid var(--color-green); }
    .card-submitted .card-value { color: var(--color-green); }

    .card-not-submitted { border-left: 4px solid var(--color-red); }
    .card-not-submitted .card-value { color: var(--color-red); }

    /* ── Responsive cards ── */
    @media (max-width: 600px) {
      .cards-row { flex-direction: column; }
    }

    /* ── Checklist Card ── */
    .checklist-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--space-lg);
    }

    .checklist-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .checklist-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .checklist-card li {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .checklist-card li:hover {
      background: var(--color-bg);
    }

    .checklist-card li.submitted-row {
      background: var(--color-green-lt);
      border-color: #bbf7d0;
    }

    .checklist-card input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--color-green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-card label {
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--color-text);
      flex: 1;
      transition: color 0.15s;
    }

    .checklist-card li.submitted-row label {
      text-decoration: line-through;
      color: var(--color-green);
      opacity: 0.8;
    }

    .status-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .status-tag.tag-submitted {
      background: var(--color-green-lt);
      color: var(--color-green);
    }

    .status-tag.tag-pending {
      background: var(--color-red-lt);
      color: var(--color-red);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>My Assignment Tracker</h1>
      <div class="subtitle">Student Submission Overview</div>
    </div>
  </header>

  <main>

    <!-- ── Summary Cards ── -->
    <p class="section-label">Summary</p>
    <div class="cards-row">

      <div class="card card-total">
        <span class="card-label">Total Students</span>
        <span class="card-value">5</span>
        <span class="card-sub">registered students</span>
      </div>

      <div class="card card-submitted">
        <span class="card-label">Submitted</span>
        <span class="card-value" id="submitted-count">0</span>
        <span class="card-sub">assignment submitted</span>
      </div>

      <div class="card card-not-submitted">
        <span class="card-label">Not Submitted</span>
        <span class="card-value" id="not-submitted-count">5</span>
        <span class="card-sub">yet to submit</span>
      </div>

    </div>

    <!-- ── Student Checklist ── -->
    <p class="section-label">Students</p>
    <section class="checklist-card">
      <h2>Student Submission List</h2>
      <ul id="student-list">
        <li>
          <input type="checkbox" id="s1" />
          <label for="s1">Ahmad Faris</label>
          <span class="status-tag tag-pending" id="tag-s1">Pending</span>
        </li>
        <li>
          <input type="checkbox" id="s2" />
          <label for="s2">Nurul Aina</label>
          <span class="status-tag tag-pending" id="tag-s2">Pending</span>
        </li>
        <li>
          <input type="checkbox" id="s3" />
          <label for="s3">Hafiz Izzuddin</label>
          <span class="status-tag tag-pending" id="tag-s3">Pending</span>
        </li>
        <li>
          <input type="checkbox" id="s4" />
          <label for="s4">Syafiqah Noor</label>
          <span class="status-tag tag-pending" id="tag-s4">Pending</span>
        </li>
        <li>
          <input type="checkbox" id="s5" />
          <label for="s5">Amirul Hakim</label>
          <span class="status-tag tag-pending" id="tag-s5">Pending</span>
        </li>
      </ul>
    </section>

  </main>

  <script>
    function updateCounts() {
      var checkboxes = document.querySelectorAll('#student-list input[type="checkbox"]');
      var submitted = 0;
      checkboxes.forEach(function (cb) {
        var li = cb.closest('li');
        var tag = document.getElementById('tag-' + cb.id);
        if (cb.checked) {
          submitted++;
          li.classList.add('submitted-row');
          tag.textContent = 'Submitted';
          tag.className = 'status-tag tag-submitted';
        } else {
          li.classList.remove('submitted-row');
          tag.textContent = 'Pending';
          tag.className = 'status-tag tag-pending';
        }
      });
      document.getElementById('submitted-count').textContent = submitted;
      document.getElementById('not-submitted-count').textContent = 5 - submitted;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var checkboxes = document.querySelectorAll('#student-list input[type="checkbox"]');
      checkboxes.forEach(function (cb) {
        cb.addEventListener('change', updateCounts);
      });
      updateCounts();
    });
  </script>

</body>
</html>
